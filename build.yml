name: Build Shard Client

on:
  push:
    paths:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Extract source
        run: |
          mkdir project
          unzip ShardClient-Source.zip -d project

      - name: Build mod
        working-directory: project
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: ShardClient
          path: project/build/libs/*.jar
